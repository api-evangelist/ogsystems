description: OGSystems was a geospatial intelligence, data analytics, and advanced
  technology company based in Chantilly, Virginia, serving the United States
  intelligence community and Department of Defense with threat analytics, machine
  learning, and geospatial exploitation solutions. The company was acquired by
  Parsons Corporation in 2019 and folded into Parsons' national security and
  intelligence portfolio. Its former domain (ogsystems.com) now redirects to
  parsons.com, and it maintains no independent public developer program, API
  reference, or machine-readable API surface. This profile is retained in the
  API Evangelist network as an identity/lead record surfaced from VC-portfolio
  data; there are no API artifacts to enrich.
